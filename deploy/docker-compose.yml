services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IMAGE_NAME:?IMAGE_NAME must be set}:${IMAGE_TAG:?IMAGE_TAG must be set}"
    container_name: "${CONTAINER_NAME:?CONTAINER_NAME must be set}"
    restart: always
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: "${CMS_SOURCE_PATH:?CMS_SOURCE_PATH must be set}"
        target: /home/app
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    environment:
      DB_HOST: "${DB_HOST:?DB_HOST must be set}"
      DB_PORT: "${DB_PORT:?DB_PORT must be set}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      DB_NAME: "${DB_NAME:?DB_NAME must be set}"
      DB_DRIVER: "${DB_DRIVER:-mysqli}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}"
