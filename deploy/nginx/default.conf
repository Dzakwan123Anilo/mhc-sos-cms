server {
    listen  1880;
    # server_name mysite.com www.mysite.com;

    root   /home/app;
    autoindex off;
    index  index.php;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # block sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* ^/(adminer\.php|config\.php|sos_db\.sql)$ {
        deny all;
        return 404;
    }

    # set expiration of assets to MAX for caching
    location ~* \.(ico|css|js|gif|jpe?g|png)$ {
           expires max;
           log_not_found off;
    }

    # only index.php may be executed through PHP-FPM
    location ~ ^/index\.php$ {
        try_files  $uri =404;
        fastcgi_pass   unix:/var/run/php-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /home/app$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 4k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # login endpoint: rate-limited at web server level
    location = /auth/act_auth {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/var/run/php-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME /home/app/index.php;
        include        fastcgi_params;
        # CI parses REQUEST_URI against SCRIPT_NAME — force front controller path
        fastcgi_param  SCRIPT_NAME /index.php;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 4k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # every other PHP file is refused
    location ~ \.php$ {
        return 404;
    }

    # main codeigniter rewrite rule
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
